<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रगति फाइनेंस - मेनू</title>
    <style>
        /* पूरे पेज का पीला बैकग्राउंड */
        body {
            background-color: #FFD700;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* हरी बॉर्डर वाला मुख्य बॉक्स */
        .main-box {
            border: 5px solid #0B6623; /* गहरा हरा रंग */
            background-color: #FFD700;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            box-sizing: border-box;
        }

        /* होम आइकॉन और टेक्स्ट */
        .home-section {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #111;
            margin-bottom: 25px;
        }

        /* विकल्पों की सूची (Links) */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-list li {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .menu-list a {
            color: #111;
            text-decoration: none;
        }

        /* लाल लाइन (अंडरलाइन) */
        .menu-list hr {
            border: none;
            height: 3px;
            background-color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <!-- Home Icon & Text -->
        <div class="home-section">
            <span>🏠</span> home
        </div>

        <!-- Options List -->
        <ul class="menu-list">
            <li>
                <a href="form.html">1. फॉर्म भरें -now</a>
                <hr>
            </li>
            <li>
                <a href="data.html">2. अपना डेटा देखें - now</a>
                <hr>
            </li>
        </ul>
    </div>

</body>
</html>
