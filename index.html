
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My WhatsApp</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 13px;
    background: #25D366;
    color: black;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
}

#home {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    font-size: 42px;
    color: #25D366;
    cursor: pointer;
    font-weight: bold;
}

.page {
    display: none;
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

h2 {
    color: #25D366;
    margin-bottom: 20px;
}

.user {
    padding: 16px;
    background: #202020;
    margin: 10px 0;
    border-radius: 10px;
    cursor: pointer;
}

.user:hover {
    background: #333;
}

#messages {
    height: 55vh;
    overflow-y: auto;
    background: #111;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.msg {
    background: #075E35;
    padding: 10px;
    border-radius: 10px;
    margin: 8px 0;
    max-width: 85%;
    width: fit-content;
    overflow-wrap: anywhere;
}

.mine {
    margin-left: auto;
    background: #056044;
}

.small {
    color: #aaa;
    font-size: 12px;
}

#recaptcha-container {
    margin: 10px 0;
}

</style>
</head>

<body>

<!-- FIRST PAGE -->

<div id="home">
    <div class="logo" onclick="showLogin()">
        WhatsApp
    </div>
</div>

<!-- LOGIN PAGE -->

<div id="login" class="page">
    <h2>WhatsApp Login</h2>

    <p>अपना मोबाइल नंबर डालें</p>

    <input
        id="phone"
        type="tel"
        placeholder="10 Digit Mobile Number"
        maxlength="10"
    >

    <div id="recaptcha-container"></div>

    <button onclick="sendOTP()">
        Send OTP
    </button>

    <input
        id="otp"
        type="number"
        placeholder="Enter OTP"
        style="display:none"
    >

    <button
        id="verifyBtn"
        onclick="verifyOTP()"
        style="display:none"
    >
        Verify OTP
    </button>

    <p id="loginStatus"></p>
</div>

<!-- MEMBERS PAGE -->

<div id="members" class="page">
    <h2>WhatsApp Members</h2>

    <p id="myNumber"></p>

    <div id="userList">
        Members Loading...
    </div>

    <button onclick="logout()">
        Logout
    </button>
</div>

<!-- CHAT PAGE -->

<div id="chatPage" class="page">

    <button onclick="showMembers()">
        ← Back
    </button>

    <h2 id="chatName">Chat</h2>

    <div id="messages"></div>

    <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
    >

    <button onclick="sendMessage()">
        Send Message
    </button>

</div>


<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

// 1. FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// 2. VARIABLES

let confirmationResult = null;
let currentUser = null;
let selectedUser = null;
let unsubscribeMessages = null;
let unsubscribeUsers = null;


// 3. PAGE CHANGE

function hideAll() {
    document.getElementById("home").style.display = "none";
    document.getElementById("login").style.display = "none";
    document.getElementById("members").style.display = "none";
    document.getElementById("chatPage").style.display = "none";
}

function showLogin() {
    hideAll();
    document.getElementById("login").style.display = "block";
}


// 4. SEND OTP

async function sendOTP() {

    const number = document.getElementById("phone").value.trim();

    if (!/^[0-9]{10}$/.test(number)) {
        alert("सही 10 अंकों का मोबाइल नंबर डालें");
        return;
    }

    const fullNumber = "+91" + number;

    try {

        if (!window.recaptchaVerifier) {
            window.recaptchaVerifier =
                new firebase.auth.RecaptchaVerifier(
                    "recaptcha-container",
                    { size: "normal" }
                );

            await window.recaptchaVerifier.render();
        }

        confirmationResult =
            await auth.signInWithPhoneNumber(
                fullNumber,
                window.recaptchaVerifier
            );

        document.getElementById("otp").style.display = "block";
        document.getElementById("verifyBtn").style.display = "block";

        document.getElementById("loginStatus").innerText =
            "OTP भेज दिया गया है";

    } catch(error) {

        alert(error.message);

        if (window.recaptchaVerifier) {
            window.recaptchaVerifier.clear();
            window.recaptchaVerifier = null;
        }
    }
}


// 5. VERIFY OTP AND CREATE PROFILE

async function verifyOTP() {

    const code = document.getElementById("otp").value.trim();

    try {

        if (!confirmationResult) {
            alert("पहले OTP भेजें");
            return;
        }

        const result = await confirmationResult.confirm(code);

        currentUser = result.user;

        const profileRef = db.collection("users").doc(currentUser.uid);

        const profile = await profileRef.get();

        if (!profile.exists) {

            await profileRef.set({
                uid: currentUser.uid,
                phone: currentUser.phoneNumber,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

        }

        showMembers();

    } catch(error) {

        alert("OTP गलत है या सत्यापन असफल हुआ: " + error.message);

    }
}


// 6. SHOW ALL MEMBERS

function showMembers() {

    hideAll();

    document.getElementById("members").style.display = "block";

    document.getElementById("myNumber").innerText =
        "Your Number: " + currentUser.phoneNumber;

    if (unsubscribeUsers) unsubscribeUsers();

    unsubscribeUsers = db.collection("users")
        .onSnapshot(snapshot => {

            const list = document.getElementById("userList");

            list.innerHTML = "";

            snapshot.forEach(doc => {

                const user = doc.data();

                if (user.uid === currentUser.uid) return;

                const div = document.createElement("div");

                div.className = "user";

                div.innerHTML =
                    "<b>Member</b><br><span class='small'></span>";

                div.querySelector("span").textContent = user.phone;

                div.onclick = () => openChat(user);

                list.appendChild(div);

            });

            if (list.innerHTML === "") {
                list.innerText = "अभी कोई दूसरा सदस्य नहीं है";
            }

        }, error => alert(error.message));
}


// 7. CREATE CHAT ID

function getChatID(uid1, uid2) {
    return [uid1, uid2].sort().join("_");
}


// 8. OPEN CHAT

function openChat(user) {

    selectedUser = user;

    hideAll();

    document.getElementById("chatPage").style.display = "block";

    document.getElementById("chatName").innerText = user.phone;

    if (unsubscribeMessages) unsubscribeMessages();

    const chatID = getChatID(currentUser.uid, user.uid);

    unsubscribeMessages = db.collection("chats")
        .doc(chatID)
        .collection("messages")
        .orderBy("createdAt")
        .onSnapshot(snapshot => {

            const box = document.getElementById("messages");

            box.innerHTML = "";

            snapshot.forEach(doc => {

                const msg = doc.data();

                const div = document.createElement("div");

                div.className = "msg" +
                    (msg.sender === currentUser.uid ? " mine" : "");

                div.textContent = msg.text;

                box.appendChild(div);

            });

            box.scrollTop = box.scrollHeight;

        }, error => alert(error.message));
}


// 9. SEND MESSAGE

async function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text || !selectedUser) return;

    const chatID = getChatID(
        currentUser.uid,
        selectedUser.uid
    );

    try {

        await db.collection("chats")
            .doc(chatID)
            .collection("messages")
            .add({

                text: text,
                sender: currentUser.uid,
                receiver: selectedUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()

            });

        input.value = "";

    } catch(error) {

        alert(error.message);

    }
}


// 10. BACK TO MEMBERS

function showMembers() {

    hideAll();

    document.getElementById("members").style.display = "block";

    document.getElementById("myNumber").innerText =
        "Your Number: " + currentUser.phoneNumber;

    if (unsubscribeUsers) unsubscribeUsers();

    unsubscribeUsers = db.collection("users")
        .onSnapshot(snapshot => {

            const list = document.getElementById("userList");
            list.innerHTML = "";

            snapshot.forEach(doc => {

                const user = doc.data();

                if (user.uid === currentUser.uid) return;

                const div = document.createElement("div");
                div.className = "user";
                div.textContent = "Member - " + user.phone;

                div.onclick = () => openChat(user);

                list.appendChild(div);

            });

            if (list.innerHTML === "") {
                list.innerText = "अभी कोई दूसरा सदस्य नहीं है";
            }

        }, error => alert(error.message));
}


// 11. LOGOUT

async function logout() {

    if (unsubscribeUsers) unsubscribeUsers();
    if (unsubscribeMessages) unsubscribeMessages();

    await auth.signOut();

    currentUser = null;
    selectedUser = null;

    hideAll();

    document.getElementById("home").style.display = "flex";
}


// 12. AUTO LOGIN CHECK

auth.onAuthStateChanged(async user => {

    if (user) {

        currentUser = user;

        try {

            const ref = db.collection("users").doc(user.uid);
            const profile = await ref.get();

            if (!profile.exists) {

                await ref.set({
                    uid: user.uid,
                    phone: user.phoneNumber,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

            }

            showMembers();

        } catch(error) {

            alert(error.message);

        }

    }

});

</script>

</body>
</html>
