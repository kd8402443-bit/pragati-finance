<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>प्रगति फाइनेंसर</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#00aaa9;
 color:#000;
}

.page{
 display:none;
 min-height:100vh;
 padding:18px;
 background:
 repeating-conic-gradient(
 from 0deg at 50% 35%,
 #00aaa9 0deg 12deg,
 #36b6b5 12deg 24deg
 );
}
.active{display:block}

.header{
 text-align:center;
 color:#075b13;
 margin:10px 0 35px;
}
.header h1{font-size:38px;margin:10px 0}
.header p{font-size:20px;margin:5px}

.home{
 font-size:34px;
 margin:35px 0;
 font-weight:500;
}

.now{
 color:#00ff00;
 font-size:25px;
 font-weight:bold;
 animation:blink 1s infinite;
 cursor:pointer;
}

@keyframes blink{
 0%,100%{opacity:1}
 50%{opacity:.15}
}

.menu{
 font-size:32px;
 margin:25px 0;
}

.card{
 background:#fff;
 padding:20px;
 border-radius:12px;
 max-width:550px;
 margin:15px auto;
 box-shadow:0 3px 10px #00666655;
}

h2{text-align:center;color:#075b13}

input,select{
 width:100%;
 padding:13px;
 margin:8px 0 15px;
 border:1px solid #888;
 border-radius:6px;
 font-size:16px;
}

label{font-weight:bold}

button{
 background:#087b24;
 color:white;
 border:0;
 border-radius:7px;
 padding:13px;
 font-size:17px;
 width:100%;
 margin:7px 0;
 cursor:pointer;
}

.back{
 background:#333;
}

.receipt{
 background:white;
 padding:20px;
 border:2px dashed #087b24;
 border-radius:8px;
 line-height:2;
}

#captchaText{
 font-size:20px;
 font-weight:bold;
 color:#075b13;
}

.small{text-align:center;font-size:13px}
</style>
</head>

<body>

<!-- HOME PAGE -->
<div id="home" class="page active">

<div class="header">
<h1>प्रगति फाइनेंसर</h1>
<p>welcome dear friends</p>
<p>मेरा मनी सपोर्ट कमेटी में आपका स्वागत है</p>
</div>

<div class="home">🏠 home</div>

<div class="menu">
1. फॉर्म भरें -
<span class="now" onclick="showPage('register')">NOW</span>
</div>

<div class="menu">
2. अपना डेटा देखें -
<span class="now" onclick="showPage('document')">NOW</span>
</div>

</div>


<!-- REGISTRATION PAGE -->
<div id="register" class="page">

<div class="card">
<h2>Registration Form</h2>

<form id="regForm">

<label>1. नाम</label>
<input id="name" required placeholder="अपना नाम लिखें">

<label>2. Your ID</label>
<input id="yourId" required placeholder="अपना ID लिखें">

<label>3. Captain ID</label>
<input id="captainId" required placeholder="Captain ID">

<label>4. Your Phone Number</label>
<input id="phone" type="tel" maxlength="10"
required placeholder="मोबाइल नंबर">

<label>5. Captain Phone Number</label>
<input id="captainPhone" type="tel" maxlength="10"
required placeholder="Captain मोबाइल नंबर">

<label>6. Your Address</label>
<input id="address" required placeholder="अपना पता लिखें">

<label>7. Your Section</label>
<select id="section" required>
<option value="">Section चुनें</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<label>8. पैसे उठ जाने वाला Month</label>
<select id="month" required>
<option value="">Month चुनें</option>
</select>

<label>9. New Password</label>
<input id="password" type="password"
required minlength="8" placeholder="नया पासवर्ड">

<label>10. CAPTCHA</label>
<p id="captchaText"></p>
<input id="captchaAnswer" required
placeholder="ऊपर का जवाब लिखें">

<button type="button" onclick="newCaptcha()">
नया CAPTCHA
</button>

<button type="submit">SUBMIT</button>

</form>

<button class="back" onclick="showPage('home')">
HOME पर वापस जाएं
</button>
</div>
</div>


<!-- RECEIPT PAGE -->
<div id="receiptPage" class="page">

<div class="card">
<h2>प्रगति फाइनेंसर</h2>
<h3 style="text-align:center">Registration Receiving</h3>

<div id="receipt" class="receipt"></div>

<button onclick="window.print()">Download / Print Receiving</button>

<button onclick="shareReceipt()">Share Receiving</button>

<button class="back" onclick="showPage('home')">HOME</button>
</div>
</div>


<!-- DOCUMENT PAGE -->
<div id="document" class="page">

<div class="card">

<h2>YOUR DOCUMENT</h2>

<p style="text-align:center">
अपना Document देखने के लिए नीचे जानकारी भरें।
</p>

<button onclick="showPage('documentLogin')">
YOUR DOCUMENT खोलें
</button>

<button class="back" onclick="showPage('home')">
HOME
</button>

</div>
</div>


<!-- DOCUMENT LOGIN -->
<div id="documentLogin" class="page">

<div class="card">

<h2>Document Login</h2>

<form id="docForm">

<label>Your Registration Number</label>
<input id="docNumber" required
placeholder="अपना Registration Number डालें">

<button type="submit">OPEN PDF</button>

</form>

<p id="docMessage" class="small"></p>

<button class="back" onclick="showPage('document')">
BACK
</button>

</div>
</div>


<script>

// PAGE CHANGE
function showPage(id){
 document.querySelectorAll('.page').forEach(p=>{
  p.classList.remove('active');
 });
 document.getElementById(id).classList.add('active');
 window.scrollTo(0,0);
}

// MONTH 1 TO 20
const monthSelect=document.getElementById('month');

for(let i=1;i<=20;i++){
 let option=document.createElement('option');
 option.value='Month-'+i;
 option.textContent='Month-'+i;
 monthSelect.appendChild(option);
}

// CAPTCHA
let correctAnswer=0;

function newCaptcha(){
 let a=Math.floor(Math.random()*9)+1;
 let b=Math.floor(Math.random()*9)+1;
 correctAnswer=a+b;
 document.getElementById('captchaText').textContent=
 a+' + '+b+' = ?';
 document.getElementById('captchaAnswer').value='';
}

newCaptcha();


// REGISTRATION
let receiptData={};

document.getElementById('regForm').addEventListener('submit',function(e){

 e.preventDefault();

 if(Number(document.getElementById('captchaAnswer').value)
 !==correctAnswer){
  alert('गलत CAPTCHA! दोबारा भरें।');
  newCaptcha();
  return;
 }

 const phone=document.getElementById('phone').value;
 const captainPhone=document.getElementById('captainPhone').value;

 if(!/^[0-9]{10}$/.test(phone) ||
 !/^[0-9]{10}$/.test(captainPhone)){
  alert('10 अंकों का मोबाइल नंबर डालें।');
  return;
 }

 receiptData={
  name:document.getElementById('name').value,
  id:document.getElementById('yourId').value,
  captain:document.getElementById('captainId').value,
  phone:phone,
  captainPhone:captainPhone,
  address:document.getElementById('address').value,
  section:document.getElementById('section').value,
  month:document.getElementById('month').value
 };

 document.getElementById('receipt').innerHTML=`
 <b>Name:</b> ${safe(receiptData.name)}<br>
 <b>Your ID:</b> ${safe(receiptData.id)}<br>
 <b>Captain ID:</b> ${safe(receiptData.captain)}<br>
 <b>Phone:</b> ${safe(receiptData.phone)}<br>
 <b>Captain Phone:</b> ${safe(receiptData.captainPhone)}<br>
 <b>Address:</b> ${safe(receiptData.address)}<br>
 <b>Section:</b> ${safe(receiptData.section)}<br>
 <b>Month:</b> ${safe(receiptData.month)}<br>
 <b>Status:</b> Submitted
 `;

 showPage('receiptPage');

});

function safe(value){
 const div=document.createElement('div');
 div.textContent=value;
 return div.innerHTML;
}

// SHARE RECEIPT
async function shareReceipt(){
 let textContent=
 'प्रगति फाइनेंसर Registration Receiving\n'+
 Object.entries(receiptData)
 .map(([k,v])=>k+': '+v).join('\n');

 if(navigator.share){
  try{
   await navigator.share({
    title:'Registration Receiving',
    text:textContent
   });
  }catch(e){}
 }else{
  alert('इस फोन में Share सुविधा उपलब्ध नहीं है।');
 }
}


// DOCUMENT LOGIN WITH SUPABASE

document.getElementById('docForm').addEventListener('submit',
async function(e){

 e.preventDefault();

 const registrationNumber =
 document.getElementById('docNumber').value.trim();

 const message =
 document.getElementById('docMessage');

 message.textContent = "PDF खोजी जा रही है...";

 try {

  const { data, error } = await supabaseClient
   .from('documents')
   .select('pdf_url')
   .eq('registration_number', registrationNumber)
   .maybeSingle();

  if(error) throw error;

  if(!data){
   message.textContent = "PDF नहीं मिली।";
   return;
  }

  if(!data.pdf_url){
   message.textContent = "PDF URL नहीं मिला।";
   return;
  }

  window.open(data.pdf_url, '_blank');

  message.textContent = "PDF खोलने का अनुरोध भेज दिया गया।";

 } catch(error) {

  console.error(error);

  message.textContent = "PDF खोलने में समस्या हुई।";

 }

});
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</script // SUPABASE CONNECTION

const SUPABASE_URL = "यहाँ अपना Supabase Project URL डालें";

const SUPABASE_KEY = "यहाँ अपनी Publishable Key डालें";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);>
</body>
</html>
