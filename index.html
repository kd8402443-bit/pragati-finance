<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>प्रगति फाइनेंसर</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#00aaa9;
 color:#000;
}

.page{
 min-height:100vh;
 padding:15px;
 display:none;
}

#home{display:block}

.header{
 text-align:center;
 padding:20px 5px;
 color:#075d19;
}

.header h1{
 font-size:38px;
 margin:10px 0;
}

.header p{
 font-size:20px;
 margin:5px;
}

.home-menu{
 margin-top:30px;
}

.menu-item{
 font-size:30px;
 padding:15px 5px;
 margin:12px 0;
 cursor:pointer;
}

.now{
 color:#00ff00;
 font-weight:bold;
 animation:blink 1s infinite;
}

@keyframes blink{
 0%,100%{opacity:1}
 50%{opacity:0.15}
}

.panel{
 background:white;
 border-radius:12px;
 padding:18px;
 max-width:550px;
 margin:15px auto;
 box-shadow:0 3px 10px #00666655;
}

h2{
 text-align:center;
 color:#087c48;
}

input,select{
 width:100%;
 padding:13px;
 margin:9px 0;
 border:1px solid #aaa;
 border-radius:6px;
 font-size:16px;
}

button{
 width:100%;
 padding:13px;
 border:0;
 border-radius:7px;
 background:#087d3d;
 color:white;
 font-size:18px;
 margin-top:12px;
 cursor:pointer;
}

.back{
 background:#555;
}

.receipt{
 background:#f1fff2;
 padding:15px;
 border:2px dashed green;
 margin-top:15px;
 display:none;
}

small{
 color:#555;
}

</style>
</head>

<body>

<!-- HOME PAGE -->

<div class="page" id="home">

<div class="header">
<h1>प्रगति फाइनेंसर</h1>
<p>Welcome Dear Friends</p>
<p>मेरा मनी स्पोर्ट कमेटी में आपका स्वागत है</p>
</div>

<div class="home-menu">

<div class="menu-item" onclick="showPage('registration')">
🏠 Home
</div>

<div class="menu-item" onclick="showPage('form')">
1. फॉर्म भरें -
<span class="now">NOW</span>
</div>

<div class="menu-item" onclick="showPage('search')">
2. अपना डेटा देखें -
<span class="now">NOW</span>
</div>

</div>
</div>


<!-- REGISTRATION PAGE -->

<div class="page" id="form">

<div class="panel">

<h2>Registration Form</h2>

<form id="memberForm">

<input id="name" placeholder="1. आपका नाम" required>

<input id="yourid" placeholder="2. Your ID" required>

<input id="captainid" placeholder="3. Captain ID" required>

<input id="phone" type="tel"
placeholder="4. Your Phone Number"
pattern="[0-9]{10}" required>

<input id="captainphone" type="tel"
placeholder="5. Captain Phone Number"
pattern="[0-9]{10}" required>

<input id="address"
placeholder="6. आपका सामान्य पता (गाँव/ब्लॉक)"
required>

<select id="section" required>
<option value="">7. Your Section चुनें</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<select id="month" required>
<option value="">8. पैसे उठाने वाला Month चुनें</option>
<option>Month-1</option>
<option>Month-2</option>
<option>Month-3</option>
<option>Month-4</option>
<option>Month-5</option>
<option>Month-6</option>
<option>Month-7</option>
<option>Month-8</option>
<option>Month-9</option>
<option>Month-10</option>
<option>Month-11</option>
<option>Month-12</option>
<option>Month-13</option>
<option>Month-14</option>
<option>Month-15</option>
<option>Month-16</option>
<option>Month-17</option>
<option>Month-18</option>
<option>Month-19</option>
<option>Month-20</option>
</select>

<div>
<label id="captchaQuestion"></label>
<input id="captchaAnswer"
type="number" placeholder="CAPTCHA का उत्तर" required>
</div>

<button type="submit" id="submitBtn">
SUBMIT
</button>

</form>

<div class="receipt" id="receipt">
<h2>प्रगति फाइनेंसर</h2>
<h3>Registration Receiving</h3>
<p id="receiptDetails"></p>

<button onclick="downloadReceipt()">
Download Receiving
</button>

<button onclick="shareReceipt()">
Share Receiving
</button>
</div>

<button class="back" onclick="showPage('home')">
HOME पर वापस जाएँ
</button>

</div>
</div>


<!-- DATA SEARCH PAGE -->

<div class="page" id="search">

<div class="panel">

<h2>अपना डेटा देखें</h2>

<input id="searchReg"
placeholder="Registration Number डालें">

<input id="searchName"
placeholder="Your Name डालें">

<button onclick="findPDF()">
SEARCH PDF
</button>

<p id="searchMessage"></p>

<button class="back" onclick="showPage('home')">
HOME पर वापस जाएँ
</button>

</div>
</div>


<script>

// SUPABASE CONNECTION

const SUPABASE_URL = "https://zqecisvjnkjqujecblmu.supabase.co";

const SUPABASE_KEY = "sb_publishable_3ICLHg0yvuiYYlAYig_Oxg_uViXahTO";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// PAGE CHANGE

function showPage(id){

document.querySelectorAll(".page").forEach(p=>{
p.style.display="none";
});

document.getElementById(id).style.display="block";

window.scrollTo(0,0);

}


// CAPTCHA

let captchaResult;

function newCaptcha(){

let a=Math.floor(Math.random()*9)+1;
let b=Math.floor(Math.random()*9)+1;

captchaResult=a+b;

document.getElementById("captchaQuestion").innerText=
"CAPTCHA: "+a+" + "+b+" = ?";
}

newCaptcha();


// REGISTRATION

let currentReceipt="";

document.getElementById("memberForm")
.addEventListener("submit",async function(e){

e.preventDefault();

let answer=Number(
document.getElementById("captchaAnswer").value
);

if(answer!==captchaResult){

alert("गलत CAPTCHA! फिर से प्रयास करें");

newCaptcha();

return;
}

let regNo="PF-"+Date.now()+"-"+Math.floor(Math.random()*1000);

let data={

reg_no:regNo,

name:document.getElementById("name").value.trim(),

your_id:document.getElementById("yourid").value.trim(),

captain_id:document.getElementById("captainid").value.trim(),

phone:document.getElementById("phone").value.trim(),

captain_phone:document.getElementById("captainphone").value.trim(),

address:document.getElementById("address").value.trim(),

section:document.getElementById("section").value,

month:document.getElementById("month").value

};

let btn=document.getElementById("submitBtn");

btn.disabled=true;
btn.innerText="Please Wait...";

try{

const {error}=await db
.from("registrations")
.insert([data]);

if(error) throw error;

currentReceipt=
"प्रगति फाइनेंसर\n"+
"Registration Receiving\n\n"+
"Registration Number: "+regNo+"\n"+
"Name: "+data.name+"\n"+
"Your ID: "+data.your_id+"\n"+
"Captain ID: "+data.captain_id+"\n"+
"Phone: "+data.phone+"\n"+
"Captain Phone: "+data.captain_phone+"\n"+
"Section: "+data.section+"\n"+
"Month: "+data.month+"\n"+
"Date: "+new Date().toLocaleString("en-IN");

document.getElementById("receiptDetails")
.innerText=currentReceipt;

document.getElementById("receipt").style.display="block";

document.getElementById("memberForm").reset();

newCaptcha();

alert("Registration सफल हुआ!");

}catch(error){

alert("Error: "+error.message);

}finally{

btn.disabled=false;
btn.innerText="SUBMIT";

}

});


// DOWNLOAD RECEIVING

function downloadReceipt(){

let blob=new Blob(
[currentReceipt],
{type:"text/plain;charset=utf-8"}
);

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;
a.download="Pragati-Receiving.txt";
a.click();

URL.revokeObjectURL(url);

}


// SHARE RECEIVING

async function shareReceipt(){

if(navigator.share){

try{

await navigator.share({
title:"प्रगति फाइनेंसर Receiving",
text:currentReceipt
});

}catch(e){}

}else{

await navigator.clipboard.writeText(currentReceipt);

alert("Receiving कॉपी हो गई।");

}

}


// PDF SEARCH

async function findPDF(){

let reg=document.getElementById("searchReg").value.trim();

let name=document.getElementById("searchName").value.trim();

let msg=document.getElementById("searchMessage");

if(!reg || !name){

msg.innerText="Registration Number और Name दोनों डालें।";

return;

}

msg.innerText="Searching...";

try{

const {data,error}=await db.rpc(
"find_member_pdf",
{
p_reg_no:reg,
p_name:name
}
);

if(error) throw error;

if(data && data.length>0){

msg.innerText="PDF मिल गई। खोल रहे हैं...";

window.open(data[0].pdf_url,"_blank");

}else{

msg.innerText="कोई PDF नहीं मिली। जानकारी जाँचें।";

}

}catch(error){

msg.innerText="Error: "+error.message;

}

}

</script>

</body>
</html>
