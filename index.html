<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>प्रगति फाइनेंसर</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#00aaa9;
 color:black;
}

.page{
 display:none;
 min-height:100vh;
 padding:15px;
}

.page.active{display:block}

header{
 text-align:center;
 color:#075b26;
}

header h1{
 font-size:clamp(32px,8vw,55px);
 margin:10px 0;
}

.welcome{font-size:23px}

.home-art{
 text-align:center;
 font-size:100px;
 margin:20px;
}

.home-link{
 display:block;
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:black;
 font-size:clamp(27px,7vw,45px);
 padding:12px 0;
 cursor:pointer;
}

.now{
 color:#00ff39;
 font-weight:bold;
 animation:blink 1s steps(2,start) infinite;
}

@keyframes blink{
 to{visibility:hidden}
}

.panel{
 max-width:600px;
 margin:15px auto;
 padding:20px;
 background:white;
 border-radius:12px;
}

h2{
 text-align:center;
 color:#075b26;
}

label{
 display:block;
 margin-top:13px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:12px;
 margin-top:5px;
 border:1px solid #999;
 border-radius:6px;
 font-size:16px;
}

button.action{
 width:100%;
 padding:13px;
 margin-top:15px;
 background:#087b35;
 color:white;
 border:0;
 border-radius:7px;
 font-size:18px;
}

.back{background:#555!important}

.receipt{
 border:2px dashed green;
 padding:15px;
 margin-top:20px;
 background:#fff;
}

.receipt h3{text-align:center}

.captcha{
 background:#ddd;
 padding:10px;
 font-weight:bold;
 letter-spacing:5px;
}

</style>
</head>

<body>

<!-- HOME PAGE -->

<section id="home" class="page active">

<header>
<h1>प्रगति फाइनेंसर</h1>
<p class="welcome">welcome dear friends</p>
<p class="welcome">मेरा मनी सपोर्ट कमेटी में आपका स्वागत है</p>
</header>

<div class="home-art">🤝</div>

<button class="home-link" onclick="showPage('home')">
🏠 home
</button>

<button class="home-link" onclick="showPage('registration')">
1. फॉर्म भरें - <span class="now">NOW</span>
</button>

<button class="home-link" onclick="showPage('data')">
2. अपना डेटा देखें - <span class="now">NOW</span>
</button>

</section>


<!-- REGISTRATION PAGE -->

<section id="registration" class="page">

<div class="panel">

<button class="action back" onclick="showPage('home')">
← Home
</button>

<h2>Registration Form</h2>

<form id="regForm">

<label>1. नाम</label>
<input name="name" required>

<label>2. Your ID</label>
<input name="yourId" required>

<label>3. Captain ID</label>
<input name="captainId" required>

<label>4. Your Phone Number</label>
<input name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" required>

<label>5. Captain Phone Number</label>
<input name="captainPhone" type="tel" pattern="[0-9]{10}" maxlength="10" required>

<label>6. Your Address</label>
<textarea name="address"></textarea>

<label>7. Your Section</label>
<select name="section" required>
<option value="">Select Section</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<label>8. पैसे उठ जाने वाला Month</label>

<select name="month" required>
<option value="">Select Month</option>
</select>

<label>9. New Password</label>
<input name="password" type="password" minlength="6" required>

<label>Captcha</label>
<div class="captcha" id="captchaCode"></div>

<input id="captchaInput" placeholder="Captcha लिखें" required>

<button type="button" onclick="makeCaptcha()">
Change Captcha
</button>

<button class="action" type="submit">
SUBMIT
</button>

</form>

<div id="receiptArea"></div>

</div>
</section>


<!-- DATA PAGE -->

<section id="data" class="page">

<div class="panel">

<button class="action back" onclick="showPage('home')">
← Home
</button>

<h2>अपना डेटा देखें</h2>

<button class="action" onclick="showPage('documentLogin')">
Your Document
</button>

</div>

</section>


<!-- DOCUMENT PAGE -->

<section id="documentLogin" class="page">

<div class="panel">

<button class="action back" onclick="showPage('data')">
← Back
</button>

<h2>Your Document Login</h2>

<form id="docForm">

<label>Document Number</label>
<input id="docNumber" required>

<label>Password</label>
<input id="docPassword" type="password" required>

<button class="action" type="submit">
PDF खोलें
</button>

</form>

<p id="docMessage"></p>

</div>

</section>


<script>

// PAGE CHANGE

function showPage(id){

 document.querySelectorAll('.page')
 .forEach(p=>p.classList.remove('active'));

 document.getElementById(id)
 .classList.add('active');

 window.scrollTo(0,0);
}


// MONTH 1 TO 20

const monthSelect=document.querySelector('[name="month"]');

for(let i=1;i<=20;i++){

 let option=document.createElement('option');

 option.value="Month-"+i;
 option.textContent="Month-"+i;

 monthSelect.appendChild(option);
}


// CAPTCHA

let captchaAnswer="";

function makeCaptcha(){

 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 captchaAnswer="";

 for(let i=0;i<5;i++){

 captchaAnswer+=chars[
 Math.floor(Math.random()*chars.length)
 ];

 }

 document.getElementById('captchaCode')
 .textContent=captchaAnswer;
}

makeCaptcha();


// REGISTRATION SUBMIT

document.getElementById('regForm')
.addEventListener('submit',function(e){

 e.preventDefault();

 const entered=document.getElementById('captchaInput')
 .value.trim().toUpperCase();

 if(entered!==captchaAnswer){

 alert("गलत CAPTCHA");

 makeCaptcha();

 return;
 }

 const formData=new FormData(this);

 const receiptNo="PF-"+Date.now();

 const fields=[
 ["नाम",formData.get("name")],
 ["Your ID",formData.get("yourId")],
 ["Captain ID",formData.get("captainId")],
 ["Your Phone",formData.get("phone")],
 ["Captain Phone",formData.get("captainPhone")],
 ["Address",formData.get("address")],
 ["Section",formData.get("section")],
 ["Month",formData.get("month")],
 ["Receipt Number",receiptNo]
 ];

 const area=document.getElementById("receiptArea");

 area.innerHTML="";

 const box=document.createElement("div");
 box.className="receipt";

 const heading=document.createElement("h3");
 heading.textContent="प्रगति फाइनेंसर Receiving";

 box.appendChild(heading);

 fields.forEach(([key,value])=>{

 const p=document.createElement("p");

 p.textContent=key+": "+value;

 box.appendChild(p);

 });

 const note=document.createElement("p");
 note.textContent="यह डेमो रसीद है। वास्तविक रजिस्ट्रेशन की पुष्टि नहीं है।";
 box.appendChild(note);

 area.appendChild(box);

 const download=document.createElement("button");

 download.className="action";
 download.textContent="Download Receiving";

 download.onclick=()=>window.print();

 area.appendChild(download);

 const share=document.createElement("button");

 share.className="action";
 share.textContent="Share Receiving";

 share.onclick=async()=>{

 const text=fields.map(x=>x[0]+": "+x[1]).join("\n");

 if(navigator.share){

 await navigator.share({text:text});

 }else if(navigator.clipboard){

 await navigator.clipboard.writeText(text);

 alert("Receiving कॉपी हो गई");

 }

 };

 area.appendChild(share);

 this.reset();

 makeCaptcha();

});


// DOCUMENT LOGIN

document.getElementById('docForm')
.addEventListener('submit',function(e){

 e.preventDefault();

 document.getElementById('docMessage')
 .textContent=
 "PDF खोलने के लिए Supabase Database और Storage का सुरक्षित कनेक्शन जोड़ना होगा।";

});

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL = "यहाँ अपना Supabase URL डालें";

const SUPABASE_KEY = "यहाँ अपनी Publishable Key डालें";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// PAGE CHANGE

function showPage(id){

 document.querySelectorAll('.page')
 .forEach(p=>p.classList.remove('active'));

 document.getElementById(id)
 .classList.add('active');

 window.scrollTo(0,0);
}


// इसके नीचे अपना पुराना JavaScript कोड रखें:
// MONTH 1 TO 20
// CAPTCHA
// REGISTRATION SUBMIT
// DOCUMENT LOGIN

</script>
 
</body>
</html>
